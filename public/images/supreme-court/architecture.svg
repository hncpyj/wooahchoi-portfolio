<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arwLight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1120" height="640" fill="#ffffff"/>

  <!-- ══════════ OFFLINE ══════════ -->
  <rect x="24" y="24" width="1072" height="132" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="44" y="50" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1.5">OFFLINE — INDEXING</text>

  <rect x="44" y="66" width="180" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="134" y="92" font-size="14" font-weight="600" text-anchor="middle" fill="#0f172a">Case law, judgments,</text>
  <text x="134" y="110" font-size="14" font-weight="600" text-anchor="middle" fill="#0f172a">treaties</text>
  <text x="134" y="126" font-size="11" text-anchor="middle" fill="#64748b">source corpus</text>

  <line x1="228" y1="99" x2="268" y2="99" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>

  <rect x="272" y="66" width="196" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="370" y="92" font-size="14" font-weight="600" text-anchor="middle" fill="#0f172a">BERT NER tagging</text>
  <text x="370" y="112" font-size="11.5" text-anchor="middle" fill="#64748b">case number · statute name</text>
  <text x="370" y="126" font-size="11.5" text-anchor="middle" fill="#64748b">party name</text>

  <line x1="472" y1="99" x2="512" y2="99" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>

  <rect x="516" y="66" width="196" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="614" y="92" font-size="14" font-weight="600" text-anchor="middle" fill="#0f172a">Indexing pipeline</text>
  <text x="614" y="112" font-size="11.5" text-anchor="middle" fill="#64748b">tags written to typed fields;</text>
  <text x="614" y="126" font-size="11.5" text-anchor="middle" fill="#64748b">re-indexed after fine-tuning</text>

  <line x1="716" y1="99" x2="756" y2="99" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>

  <rect x="760" y="66" width="316" height="66" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="918" y="92" font-size="14" font-weight="700" text-anchor="middle" fill="#3730a3">Field-typed index</text>
  <text x="918" y="112" font-size="11.5" text-anchor="middle" fill="#4f46e5">one field per entity type, so a query can be</text>
  <text x="918" y="126" font-size="11.5" text-anchor="middle" fill="#4f46e5">routed instead of matched everywhere</text>

  <!-- ══════════ ONLINE ══════════ -->
  <rect x="24" y="176" width="1072" height="268" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="44" y="202" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1.5">ONLINE — QUERY</text>

  <rect x="44" y="218" width="150" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="119" y="248" font-size="14" font-weight="600" text-anchor="middle" fill="#0f172a">User query</text>
  <text x="119" y="268" font-size="11.5" text-anchor="middle" fill="#64748b">judge, clerk,</text>
  <text x="119" y="282" font-size="11.5" text-anchor="middle" fill="#64748b">litigant</text>

  <line x1="198" y1="254" x2="238" y2="254" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- query understanding -->
  <rect x="242" y="206" width="266" height="180" rx="10" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.6"/>
  <text x="375" y="230" font-size="12.5" font-weight="700" text-anchor="middle" fill="#4338ca">QUERY UNDERSTANDING</text>

  <rect x="258" y="242" width="234" height="60" rx="7" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="375" y="264" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">SFX + SRL — intent</text>
  <text x="375" y="282" font-size="11.5" text-anchor="middle" fill="#64748b">recency · which court · case context</text>
  <text x="375" y="296" font-size="11" text-anchor="middle" fill="#7c3aed">+4% over the rule-based baseline</text>

  <rect x="258" y="312" width="234" height="58" rx="7" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="375" y="334" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">BERT NER — entities</text>
  <text x="375" y="352" font-size="11.5" text-anchor="middle" fill="#64748b">case number · statute · party</text>
  <text x="375" y="366" font-size="11" text-anchor="middle" fill="#64748b">SRL labels where categories were ambiguous</text>

  <line x1="512" y1="296" x2="552" y2="296" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- retrieval -->
  <rect x="556" y="206" width="254" height="180" rx="10" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.6"/>
  <text x="683" y="230" font-size="12.5" font-weight="700" text-anchor="middle" fill="#4338ca">RETRIEVAL</text>

  <rect x="572" y="242" width="222" height="52" rx="7" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="683" y="263" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">Field routing</text>
  <text x="683" y="281" font-size="11.5" text-anchor="middle" fill="#64748b">send each term to the field that holds it</text>

  <rect x="572" y="304" width="222" height="66" rx="7" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="683" y="325" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">Vector search</text>
  <text x="683" y="343" font-size="11.5" text-anchor="middle" fill="#64748b">query expansion</text>
  <text x="683" y="359" font-size="11.5" text-anchor="middle" fill="#64748b">typo correction</text>

  <line x1="814" y1="296" x2="854" y2="296" stroke="#64748b" stroke-width="1.6" marker-end="url(#arw)"/>

  <rect x="858" y="242" width="218" height="108" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="967" y="270" font-size="14" font-weight="700" text-anchor="middle" fill="#047857">Ranked results</text>
  <text x="967" y="294" font-size="12.5" text-anchor="middle" fill="#065f46">5+ min → 8 s   (37×)</text>
  <text x="967" y="316" font-size="12.5" text-anchor="middle" fill="#065f46">375+ misanalysed cases resolved</text>
  <text x="967" y="338" font-size="11" text-anchor="middle" fill="#059669">related terms · recommended keywords</text>

  <!-- ══════════ ANALYTICS LOOP ══════════ -->
  <rect x="24" y="464" width="1072" height="152" rx="12" fill="#fffbeb" stroke="#fde68a"/>
  <text x="44" y="490" font-size="12" font-weight="700" fill="#b45309" letter-spacing="1.5">FEEDBACK LOOP — SEARCH LOG ANALYTICS</text>

  <rect x="44" y="506" width="190" height="88" rx="8" fill="#ffffff" stroke="#fcd34d"/>
  <text x="139" y="536" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0f172a">Search logs</text>
  <text x="139" y="558" font-size="11.5" text-anchor="middle" fill="#92400e">queries, zero-result terms,</text>
  <text x="139" y="573" font-size="11.5" text-anchor="middle" fill="#92400e">click-through</text>

  <line x1="238" y1="550" x2="278" y2="550" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwLight)"/>

  <rect x="282" y="506" width="226" height="88" rx="8" fill="#ffffff" stroke="#fcd34d"/>
  <text x="395" y="536" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0f172a">LDA + time-series</text>
  <text x="395" y="558" font-size="11.5" text-anchor="middle" fill="#92400e">supervised tagging degraded results;</text>
  <text x="395" y="573" font-size="11.5" text-anchor="middle" fill="#92400e">unsupervised LDA performed better</text>

  <line x1="512" y1="550" x2="552" y2="550" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwLight)"/>

  <rect x="556" y="506" width="254" height="88" rx="8" fill="#ffffff" stroke="#fcd34d"/>
  <text x="683" y="536" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0f172a">Related &amp; recommended terms</text>
  <text x="683" y="558" font-size="11.5" text-anchor="middle" fill="#92400e">fed back into query expansion</text>
  <text x="683" y="573" font-size="11.5" text-anchor="middle" fill="#92400e">and the results UI</text>

  <line x1="814" y1="550" x2="854" y2="550" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arwLight)"/>

  <rect x="858" y="506" width="218" height="88" rx="8" fill="#ffffff" stroke="#fcd34d"/>
  <text x="967" y="536" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0f172a">Admin dashboards</text>
  <text x="967" y="558" font-size="11.5" text-anchor="middle" fill="#92400e">line · bubble · dendrogram</text>
  <text x="967" y="573" font-size="11.5" text-anchor="middle" fill="#92400e">for search-quality monitoring</text>

  <!-- feedback arrow up into retrieval -->
  <path d="M 683 502 L 683 470 L 683 400" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arw)"/>
  <text x="695" y="432" font-size="11" fill="#b45309">expansion terms</text>
</svg>
