<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<defs><marker id="air-search-engine" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect width="1200" height="630" fill="#ffffff"/>
<rect x="0" y="0" width="1200" height="8" fill="#0d9488"/>

<text x="72" y="110" font-size="17" font-weight="700" letter-spacing="2.4" fill="#0d9488">RETRIEVAL AND GROUNDING</text>
<text x="72" y="172" font-size="42" font-weight="700" fill="#0f172a">Six domains, six encoders, one router,</text>
<text x="72" y="224" font-size="42" font-weight="700" fill="#0f172a">and a test for whether the answer used them</text>

<rect x="72" y="300" width="168" height="104" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="156" y="344" font-size="19" font-weight="600" text-anchor="middle" fill="#0f172a">Query</text>
<text x="156" y="370" font-size="15" font-weight="400" text-anchor="middle" fill="#64748b">DistilBERT router</text>
<line x1="246" y1="352" x2="284" y2="352" stroke="#94a3b8" stroke-width="2" marker-end="url(#air-search-engine)"/>

<rect x="292" y="262" width="196" height="180" rx="12" fill="#f0fdfa" stroke="#99f6e4"/>
<text x="390" y="298" font-size="18" font-weight="600" text-anchor="middle" fill="#0f172a">Domain index</text>
<text x="390" y="330" font-size="14.5" text-anchor="middle" fill="#475569">SciBERT · BioBERT</text>
<text x="390" y="354" font-size="14.5" text-anchor="middle" fill="#475569">FinBERT · LegalBERT</text>
<text x="390" y="378" font-size="14.5" text-anchor="middle" fill="#475569">ClinicalBERT · general</text>
<text x="390" y="414" font-size="14.5" text-anchor="middle" fill="#0d9488">BM25 + FAISS-HNSW</text>
<line x1="494" y1="352" x2="532" y2="352" stroke="#94a3b8" stroke-width="2" marker-end="url(#air-search-engine)"/>

<rect x="540" y="300" width="176" height="104" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="628" y="340" font-size="18" font-weight="600" text-anchor="middle" fill="#0f172a">RRF fusion</text>
<text x="628" y="368" font-size="15" text-anchor="middle" fill="#64748b">ColBERTv2 rerank</text>
<line x1="722" y1="352" x2="760" y2="352" stroke="#94a3b8" stroke-width="2" marker-end="url(#air-search-engine)"/>

<rect x="768" y="300" width="160" height="104" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="848" y="340" font-size="18" font-weight="600" text-anchor="middle" fill="#0f172a">Generation</text>
<text x="848" y="368" font-size="15" text-anchor="middle" fill="#64748b">cited answer</text>
<line x1="934" y1="352" x2="972" y2="352" stroke="#94a3b8" stroke-width="2" marker-end="url(#air-search-engine)"/>

<rect x="980" y="262" width="148" height="180" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
<text x="1054" y="300" font-size="18" font-weight="600" text-anchor="middle" fill="#0f172a">Grounding</text>
<text x="1054" y="332" font-size="14.5" text-anchor="middle" fill="#475569">no context</text>
<text x="1054" y="356" font-size="14.5" text-anchor="middle" fill="#475569">swapped</text>
<text x="1054" y="380" font-size="14.5" text-anchor="middle" fill="#475569">corrupted</text>
<text x="1054" y="416" font-size="14.5" text-anchor="middle" fill="#ea580c">does it change?</text>

<line x1="72" y1="500" x2="1128" y2="500" stroke="#e2e8f0" stroke-width="1"/>
<text x="72" y="546" font-size="16" fill="#475569">21 metrics, two-proportion z-test and paired Welch's t-test, Benjamini-Hochberg correction,</text>
<text x="72" y="576" font-size="16" fill="#475569">Cohen's h and d, Wilson score intervals, small-sample warnings below n = 30.</text>
</svg>
