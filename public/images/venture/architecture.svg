<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="varw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1120" height="600" fill="#ffffff"/>

  <!-- ══════════ INDEXING ══════════ -->
  <rect x="24" y="24" width="1072" height="216" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="44" y="50" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1.5">INDEXING — DOCUMENTS THAT LIVE SOMEWHERE ELSE</text>

  <rect x="44" y="66" width="186" height="156" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="137" y="94" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0f172a">AWS S3</text>
  <text x="137" y="118" font-size="11.5" text-anchor="middle" fill="#64748b">notices, FAQ attachments,</text>
  <text x="137" y="134" font-size="11.5" text-anchor="middle" fill="#64748b">guidance documents,</text>
  <text x="137" y="150" font-size="11.5" text-anchor="middle" fill="#64748b">application forms</text>
  <text x="137" y="180" font-size="11.5" text-anchor="middle" fill="#64748b">the search server never</text>
  <text x="137" y="196" font-size="11.5" text-anchor="middle" fill="#64748b">holds the originals</text>

  <line x1="234" y1="144" x2="274" y2="144" stroke="#64748b" stroke-width="1.6" marker-end="url(#varw)"/>

  <rect x="278" y="66" width="196" height="156" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="376" y="94" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0f172a">S3 download method</text>
  <text x="376" y="118" font-size="11.5" text-anchor="middle" fill="#4f46e5">key path recreated locally</text>
  <text x="376" y="142" font-size="11.5" text-anchor="middle" fill="#64748b">retries and failure handling,</text>
  <text x="376" y="158" font-size="11.5" text-anchor="middle" fill="#64748b">because a network fetch is</text>
  <text x="376" y="174" font-size="11.5" text-anchor="middle" fill="#64748b">a step that can fail and a</text>
  <text x="376" y="190" font-size="11.5" text-anchor="middle" fill="#64748b">local file read is not</text>

  <line x1="478" y1="144" x2="518" y2="144" stroke="#64748b" stroke-width="1.6" marker-end="url(#varw)"/>

  <rect x="522" y="66" width="196" height="156" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="620" y="94" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0f172a">Text extraction</text>
  <text x="620" y="118" font-size="11.5" text-anchor="middle" fill="#4f46e5">Aspose · PDFBox</text>
  <text x="620" y="142" font-size="11.5" text-anchor="middle" fill="#64748b">a PDF or a Word file is not</text>
  <text x="620" y="158" font-size="11.5" text-anchor="middle" fill="#64748b">text until something makes</text>
  <text x="620" y="174" font-size="11.5" text-anchor="middle" fill="#64748b">it text; attachments are</text>
  <text x="620" y="190" font-size="11.5" text-anchor="middle" fill="#64748b">searchable, not just titles</text>

  <line x1="722" y1="144" x2="762" y2="144" stroke="#64748b" stroke-width="1.6" marker-end="url(#varw)"/>

  <rect x="766" y="66" width="150" height="156" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="841" y="94" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0f172a">Index</text>
  <text x="841" y="118" font-size="11.5" text-anchor="middle" fill="#64748b">three collections:</text>
  <text x="841" y="140" font-size="11.5" text-anchor="middle" fill="#64748b">scheme guidance</text>
  <text x="841" y="156" font-size="11.5" text-anchor="middle" fill="#64748b">venture disclosures</text>
  <text x="841" y="172" font-size="11.5" text-anchor="middle" fill="#64748b">customer support</text>

  <line x1="920" y1="144" x2="960" y2="144" stroke="#64748b" stroke-width="1.6" marker-end="url(#varw)"/>

  <rect x="964" y="66" width="112" height="156" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="1020" y="98" font-size="13" font-weight="700" text-anchor="middle" fill="#b91c1c">Recursive</text>
  <text x="1020" y="116" font-size="13" font-weight="700" text-anchor="middle" fill="#b91c1c">cleanup</text>
  <text x="1020" y="142" font-size="11" text-anchor="middle" fill="#991b1b">depth-first:</text>
  <text x="1020" y="158" font-size="11" text-anchor="middle" fill="#991b1b">children</text>
  <text x="1020" y="174" font-size="11" text-anchor="middle" fill="#991b1b">before</text>
  <text x="1020" y="190" font-size="11" text-anchor="middle" fill="#991b1b">parents</text>

  <path d="M 1020 226 L 1020 250 L 137 250 L 137 226" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="560" y="245" font-size="11" text-anchor="middle" fill="#64748b">temp tree removed after every run, so an indexing job leaves no residue on disk</text>

  <!-- ══════════ QUERY ══════════ -->
  <rect x="24" y="272" width="1072" height="200" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="44" y="298" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1.5">QUERY — REST API + THE SEARCH PAGE THAT CONSUMES IT</text>

  <rect x="44" y="314" width="216" height="140" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="152" y="342" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0f172a">RESTful search API</text>
  <text x="152" y="366" font-size="11.5" text-anchor="middle" fill="#4f46e5">keyword · category · sort ·</text>
  <text x="152" y="382" font-size="11.5" text-anchor="middle" fill="#4f46e5">date range · paging</text>
  <text x="152" y="406" font-size="11.5" text-anchor="middle" fill="#64748b">shipped with a written</text>
  <text x="152" y="422" font-size="11.5" text-anchor="middle" fill="#64748b">guide, because another</text>
  <text x="152" y="438" font-size="11.5" text-anchor="middle" fill="#64748b">team had to call it</text>

  <line x1="264" y1="384" x2="304" y2="384" stroke="#64748b" stroke-width="1.6" marker-end="url(#varw)"/>

  <rect x="308" y="314" width="230" height="140" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="423" y="342" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0f172a">Refine within results</text>
  <text x="423" y="366" font-size="11.5" text-anchor="middle" fill="#64748b">a second query applied to</text>
  <text x="423" y="382" font-size="11.5" text-anchor="middle" fill="#64748b">the current result set rather</text>
  <text x="423" y="398" font-size="11.5" text-anchor="middle" fill="#64748b">than the whole corpus —</text>
  <text x="423" y="414" font-size="11.5" text-anchor="middle" fill="#64748b">narrowing, not restarting</text>

  <line x1="542" y1="384" x2="582" y2="384" stroke="#64748b" stroke-width="1.6" marker-end="url(#varw)"/>

  <rect x="586" y="314" width="230" height="140" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="701" y="342" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0f172a">Sort and period</text>
  <text x="701" y="366" font-size="11.5" text-anchor="middle" fill="#64748b">relevance or newest first;</text>
  <text x="701" y="382" font-size="11.5" text-anchor="middle" fill="#64748b">all · 1 day · 1 week ·</text>
  <text x="701" y="398" font-size="11.5" text-anchor="middle" fill="#64748b">1 month · 1 year · custom</text>
  <text x="701" y="422" font-size="11.5" text-anchor="middle" fill="#64748b">government notices go stale</text>

  <line x1="820" y1="384" x2="860" y2="384" stroke="#64748b" stroke-width="1.6" marker-end="url(#varw)"/>

  <rect x="864" y="314" width="212" height="140" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="970" y="342" font-size="13.5" font-weight="700" text-anchor="middle" fill="#047857">Results by category</text>
  <text x="970" y="368" font-size="11.5" text-anchor="middle" fill="#065f46">counted per collection,</text>
  <text x="970" y="384" font-size="11.5" text-anchor="middle" fill="#065f46">zero counts included</text>
  <text x="970" y="410" font-size="11.5" text-anchor="middle" fill="#059669">popular terms surfaced</text>
  <text x="970" y="426" font-size="11.5" text-anchor="middle" fill="#059669">beside the query box</text>

  <!-- footnote -->
  <rect x="24" y="492" width="1072" height="84" rx="12" fill="#fffbeb" stroke="#fde68a"/>
  <text x="44" y="520" font-size="12" font-weight="700" fill="#b45309" letter-spacing="1.5">WHY THE DELETE LOGIC IS ON THIS DIAGRAM AT ALL</text>
  <text x="44" y="546" font-size="12.5" fill="#92400e">S3 keys are paths, so fetching pdf/202103/11/&lt;file&gt; recreates a nested tree locally — and a delete call will not remove a directory that still has</text>
  <text x="44" y="565" font-size="12.5" fill="#92400e">contents. Without a depth-first pass that clears children before parents, every run leaves debris and the disk fills up in production, not in testing.</text>
</svg>
