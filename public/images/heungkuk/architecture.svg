<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="harw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="harwLight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1120" height="560" fill="#ffffff"/>

  <!-- legend for ownership -->
  <rect x="24" y="20" width="14" height="14" rx="3" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="46" y="32" font-size="12" fill="#4338ca">built by me on this project</text>
  <rect x="252" y="20" width="14" height="14" rx="3" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="274" y="32" font-size="12" fill="#64748b">existing platform</text>

  <!-- ══════════ BROWSER ══════════ -->
  <rect x="24" y="52" width="1072" height="216" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="44" y="78" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1.5">BROWSER — THE PAGE I OWNED</text>

  <rect x="44" y="94" width="164" height="156" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="126" y="122" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0f172a">Empty state</text>
  <text x="126" y="146" font-size="11.5" text-anchor="middle" fill="#4f46e5">popular search terms</text>
  <text x="126" y="162" font-size="11.5" text-anchor="middle" fill="#4f46e5">as tappable chips</text>
  <text x="126" y="188" font-size="11.5" text-anchor="middle" fill="#64748b">a search box with nothing</text>
  <text x="126" y="204" font-size="11.5" text-anchor="middle" fill="#64748b">in it is a dead end;</text>
  <text x="126" y="220" font-size="11.5" text-anchor="middle" fill="#64748b">the chips give the user</text>
  <text x="126" y="236" font-size="11.5" text-anchor="middle" fill="#64748b">somewhere to start</text>

  <line x1="212" y1="172" x2="252" y2="172" stroke="#64748b" stroke-width="1.6" marker-end="url(#harw)"/>

  <rect x="256" y="94" width="200" height="156" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="356" y="122" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0f172a">Typing</text>
  <text x="356" y="146" font-size="11.5" text-anchor="middle" fill="#4f46e5">auto-completion over AJAX</text>
  <text x="356" y="170" font-size="11.5" text-anchor="middle" fill="#64748b">debounced so a fast typist</text>
  <text x="356" y="186" font-size="11.5" text-anchor="middle" fill="#64748b">does not fire a request</text>
  <text x="356" y="202" font-size="11.5" text-anchor="middle" fill="#64748b">per keystroke, and late</text>
  <text x="356" y="218" font-size="11.5" text-anchor="middle" fill="#64748b">responses are discarded</text>
  <text x="356" y="234" font-size="11.5" text-anchor="middle" fill="#64748b">rather than rendered</text>

  <line x1="460" y1="172" x2="500" y2="172" stroke="#64748b" stroke-width="1.6" marker-end="url(#harw)"/>

  <rect x="504" y="94" width="230" height="156" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="619" y="122" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0f172a">Results, rendered in place</text>
  <text x="619" y="146" font-size="11.5" text-anchor="middle" fill="#4f46e5">JSP + JSTL server render,</text>
  <text x="619" y="162" font-size="11.5" text-anchor="middle" fill="#4f46e5">then AJAX for everything after</text>
  <text x="619" y="186" font-size="11.5" text-anchor="middle" fill="#64748b">continuous scroll appends the</text>
  <text x="619" y="202" font-size="11.5" text-anchor="middle" fill="#64748b">next page instead of reloading;</text>
  <text x="619" y="218" font-size="11.5" text-anchor="middle" fill="#64748b">category switches and refine-</text>
  <text x="619" y="234" font-size="11.5" text-anchor="middle" fill="#64748b">within-results reuse the same path</text>

  <line x1="738" y1="172" x2="778" y2="172" stroke="#64748b" stroke-width="1.6" marker-end="url(#harw)"/>

  <rect x="782" y="94" width="294" height="156" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="929" y="122" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0f172a">Six categories, counted</text>
  <text x="929" y="148" font-size="11.5" text-anchor="middle" fill="#64748b">menus · products · FAQ · forms ·</text>
  <text x="929" y="164" font-size="11.5" text-anchor="middle" fill="#64748b">glossary · notices</text>
  <text x="929" y="190" font-size="11.5" text-anchor="middle" fill="#4f46e5">every category shows its own count,</text>
  <text x="929" y="206" font-size="11.5" text-anchor="middle" fill="#4f46e5">including the zero ones — the user</text>
  <text x="929" y="222" font-size="11.5" text-anchor="middle" fill="#4f46e5">learns the shape of the result set</text>
  <text x="929" y="238" font-size="11.5" text-anchor="middle" fill="#4f46e5">before opening a single tab</text>

  <!-- ══════════ SERVER ══════════ -->
  <rect x="24" y="288" width="1072" height="128" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="44" y="314" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1.5">SERVER — EXISTING SEARCH PLATFORM</text>

  <rect x="44" y="330" width="412" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="250" y="356" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0f172a">Java search API</text>
  <text x="250" y="378" font-size="11.5" text-anchor="middle" fill="#64748b">query · category · date range · sort · fields ·</text>
  <text x="250" y="393" font-size="11.5" text-anchor="middle" fill="#64748b">file extension · refine-within-results · paging</text>

  <line x1="460" y1="365" x2="500" y2="365" stroke="#64748b" stroke-width="1.6" marker-end="url(#harw)"/>

  <rect x="504" y="330" width="230" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="619" y="356" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0f172a">Korean morphology</text>
  <text x="619" y="378" font-size="11.5" text-anchor="middle" fill="#64748b">terms matched separately and</text>
  <text x="619" y="393" font-size="11.5" text-anchor="middle" fill="#64748b">out of order, not as a substring</text>

  <line x1="738" y1="365" x2="778" y2="365" stroke="#64748b" stroke-width="1.6" marker-end="url(#harw)"/>

  <rect x="782" y="330" width="294" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="929" y="356" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0f172a">Indexed content</text>
  <text x="929" y="378" font-size="11.5" text-anchor="middle" fill="#64748b">site menus, product pages, FAQ entries,</text>
  <text x="929" y="393" font-size="11.5" text-anchor="middle" fill="#64748b">PDF forms, glossary, notices</text>

  <!-- ══════════ LOGS ══════════ -->
  <rect x="24" y="436" width="1072" height="100" rx="12" fill="#fffbeb" stroke="#fde68a"/>
  <text x="44" y="462" font-size="12" font-weight="700" fill="#b45309" letter-spacing="1.5">POST-LAUNCH — LOG-BASED QUALITY MONITORING</text>

  <text x="44" y="490" font-size="12.5" fill="#92400e">Search logs from the live site were the acceptance evidence: which queries returned nothing, which categories users actually opened,</text>
  <text x="44" y="510" font-size="12.5" fill="#92400e">and which terms were common enough to become the popular-term chips. Rollout was supported until those numbers stopped moving.</text>

  <path d="M 560 432 L 560 420 L 126 420 L 126 258" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#harw)"/>
  <text x="140" y="284" font-size="11" fill="#b45309">popular terms</text>
</svg>
